<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners (Bottle Green) -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" stroke="#34d399" stroke-width="8"/>
  
  <!-- Subtle rising dawn arc (Mint & White glow) -->
  <circle cx="256" cy="220" r="140" fill="url(#sun)" opacity="0.35"/>
  <circle cx="256" cy="220" r="110" fill="#ffffff" opacity="0.15"/>
  
  <!-- Devanagari 'ग' for GramSetu in Crisp Pure White -->
  <text x="256" y="360" font-family="'Noto Sans Devanagari', 'Mukta', 'Arial', sans-serif" font-size="280" font-weight="900" fill="#ffffff" text-anchor="middle" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.5))">ग</text>
  
  <!-- Bridge / Setu Base in White & Mint -->
  <path d="M 80 430 Q 256 380 432 430" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
