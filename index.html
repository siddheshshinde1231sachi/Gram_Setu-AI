<body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-800 selection:text-white min-h-screen flex flex-col justify-between">

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./frontend/sw.js').then((reg) => {
          console.log('GramSetu ServiceWorker registered:', reg.scope);
        }).catch((err) => {
          console.log('GramSetu ServiceWorker failed:', err);
        });
      });
    }

    // Subscribe State changes to re-render components automatically
    window.appState.subscribe(() => {
      window.components.render();
    });

    // Initial App Render
    document.addEventListener('DOMContentLoaded', () => {
      window.components.render();
    });
  </script>
